name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # react-router 8 needs Node 22.22+.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vauditorium
          POSTGRES_PASSWORD: vauditorium
          POSTGRES_DB: vauditorium
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://vauditorium:vauditorium@localhost:5432/vauditorium"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations to an empty database
        run: npm run db:migrate

      - name: Applying them again changes nothing
        run: npm run db:migrate

      - name: Every migration file is recorded as applied
        run: npm run db:check

      - name: The seed data satisfies every constraint
        run: npm run db:seed
